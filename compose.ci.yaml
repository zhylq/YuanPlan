name: yuanplan-ci
services:
  db:
    image: yuanplan-db:local
    build:
      context: .
      target: database
    environment:
      POSTGRES_DB: yuanplan_ci_test
      POSTGRES_PASSWORD: disposable-ci-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d yuanplan_ci_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  verify:
    build:
      context: .
      dockerfile: scripts/ci/Dockerfile.verify
    environment:
      CI: "true"
      TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@db:5432/yuanplan_ci_test
    depends_on:
      db:
        condition: service_healthy
